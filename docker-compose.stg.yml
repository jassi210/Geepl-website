name: goodenough-stg

services:
  postgres:
    image: postgres:16-alpine
    container_name: geepl_stg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-goodenough_stg}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_stg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-goodenough_stg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geepl_stg

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geepl_stg_migrate
    command: ["node", "src/db/migrations/run.js"]
    environment:
      NODE_ENV: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-goodenough_stg}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geepl_stg
    restart: "no"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geepl_stg_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-goodenough_stg}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - geepl_stg

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    container_name: geepl_stg_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - geepl_stg

volumes:
  pgdata_stg:

networks:
  geepl_stg:
    driver: bridge

